<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝔐𝔬𝔬𝔫𝔖𝔲𝔠𝔲𝔟 | Links</title>
    <!-- Ícones via Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0b14;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(138, 43, 226, 0.25), transparent 40%),
                radial-gradient(circle at 50% 90%, rgba(75, 0, 130, 0.2), transparent 40%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Foto de Perfil */
        .profile-container {
            position: relative;
            margin-bottom: 16px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.8);
        }

        /* Nome de Usuário */
        .username {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 24px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
        }

        /* Container dos Links */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Botão de Link */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            padding: 16px 20px;
            background: rgba(22, 18, 36, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            color: #f3e8ff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .link-btn i {
            position: absolute;
            left: 20px;
            font-size: 1.3rem;
            color: #c084fc;
            transition: color 0.3s ease;
        }

        /* Efeito de Hover nos Botões */
        .link-btn:hover {
            background: linear-gradient(135deg, #7e22ce, #581c87);
            border-color: #c084fc;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.4);
        }

        .link-btn:hover i {
            color: #ffffff;
        }

        /* Rodapé sutil */
        footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: #71717a;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Foto de Perfil -->
        <div class="profile-container">
            <img src="Foto.jpg" alt="𝔐𝔬𝔬𝔫𝔖𝔲𝔠𝔲𝔟" class="profile-img">
        </div>

        <!-- Nome do Perfil -->
        <h1 class="username">𝔐𝔬𝔬𝔫𝔖𝔲𝔠𝔲𝔟</h1>

        <!-- Botões de Redes/Links -->
        <div class="links-container">
            
            <a href="https://onlyfans.com/SEU_USUARIO" target="_blank" class="link-btn">
                <i class="fa-solid fa-star"></i>
                OnlyFans
            </a>

            <a href="https://privacy.com.br/checkout/SEU_USUARIO" target="_blank" class="link-btn">
                <i class="fa-solid fa-lock"></i>
                Privacy
            </a>

            <a href="https://discord.gg/SEU_CONVITE" target="_blank" class="link-btn">
                <i class="fa-brands fa-discord"></i>
                Discord VIP
            </a>

            <a href="https://t.me/SEU_CANAL" target="_blank" class="link-btn">
                <i class="fa-brands fa-telegram"></i>
                Telegram
            </a>

        </div>

        <footer>
            &copy; 𝔐𝔬𝔬𝔫𝔖𝔲𝔠𝔲𝔟 • Todos os direitos reservados
        </footer>
    </div>

</body>
</html>
