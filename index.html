<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝔐𝔬𝔬𝔫𝔖𝔲𝔠𝔲𝔟 | Links</title>
    <!-- Ícones via Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0b14;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(138, 43, 226, 0.25), transparent 40%),
                radial-gradient(circle at 50% 90%, rgba(75, 0, 130, 0.2), transparent 40%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* --------------------------------------------------
           ANIMAÇÕES (KEYFRAMES)
        -------------------------------------------------- */
        /* Entrada Suave de Baixo para Cima */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Animação Flutuante e Brilho Pulsante na Foto */
        @keyframes floatAndGlow {
            0%, 100% {
                transform: translateY(0);
                box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
            }
            50% {
                transform: translateY(-8px);
                box-shadow: 0 0 32px rgba(168, 85, 247, 0.85);
            }
        }

        /* Efeito de Luz Passando sobre os Botões */
        @keyframes shine {
            100% {
                left: 125%;
            }
        }

        /* --------------------------------------------------
           ELEMENTOS
        -------------------------------------------------- */
        /* Foto de Perfil */
        .profile-container {
            position: relative;
            margin-bottom: 16px;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #a855f7;
            animation: floatAndGlow 4s ease-in-out infinite;
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.08);
        }

        /* Nome de Usuário */
        .username {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 24px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
            opacity: 0;
        }

        /* Container dos Links */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Botão de Link com Animações */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            padding: 16px 20px;
            background: rgba(22, 18, 36, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            color: #f3e8ff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            backdrop-filter: blur(8px);
            overflow: hidden;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        /* Efeito de brilho varrendo o botão */
        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.15),
                transparent
            );
            transform: skewX(-25deg);
        }

        .link-btn:hover::before {
            animation: shine 0.75s ease;
        }

        /* Efeito de Entrada Escalonada (Delay para cada botão) */
        .link-btn:nth-child(1) { animation-delay: 0.3s; }
        .link-btn:nth-child(2) { animation-delay: 0.45s; }
        .link-btn:nth-child(3) { animation-delay: 0.6s; }
        .link-btn:nth-child(4) { animation-delay: 0.75s; }

        .link-btn i {
            position: absolute;
            left: 20px;
            font-size: 1.3rem;
            color: #c084fc;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        /* Efeito Hover nos Botões */
        .link-btn:hover {
            background: linear-gradient(135deg, #7e22ce, #581c87);
            border-color: #c084fc;
            color: #ffffff;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.5);
        }

        .link-btn:hover i {
            color: #ffffff;
            transform: scale(1.15);
        }

        /* Rodapé sutil */
        footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: #71717a;
            animation: fadeInUp 0.8s ease-out 0.9s forwards;
            opacity: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Foto de Perfil com Animação Flutuante -->
        <div class="profile-container">
            <img src="Foto.jpg" alt="𝔐𝔬𝔬𝔫𝔖𝔲𝔠𝔲𝔟" class="profile-img">
        </div>

        <!-- Nome do Perfil -->
        <h1 class="username">𝔐𝔬𝔬𝔫𝔖𝔲𝔠𝔲𝔟</h1>

        <!-- Botões de Redes/Links com Entrada Escalonada -->
        <div class="links-container">
            
            <a href="https://onlyfans.com/moonsucubb" target="_blank" class="link-btn">
                <i class="fa-solid fa-star"></i>
                OnlyFans
            </a>

            <a href="https://share.google/553IbCCXtJL4QjRIJ" target="_blank" class="link-btn">
                <i class="fa-solid fa-lock"></i>
                Privacy
            </a>

            <a href="https://discord.gg/UJV236Ktq" target="_blank" class="link-btn">
                <i class="fa-brands fa-discord"></i>
                Discord VIP
            </a>

            <a href="https://t.me/SEU_CANAL" target="_blank" class="link-btn">
                <i class="fa-brands fa-telegram"></i>
                Telegram
            </a>

        </div>

        <footer>
            &copy; 𝔐𝔬𝔬𝔫𝔖𝔲𝔠𝔲𝔟 • Todos os direitos reservados
        </footer>
    </div>

</body>
</html>
