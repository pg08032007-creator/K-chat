<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>K</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg-dark: #09090b;
  --bg-card: #111113;
  --bg-input: #1a1a1e;
  --border-dark: #27272a;
  --text-primary: #fafafa;
  --text-secondary: #a1a1aa;
  --accent: #6d28d9;
  --accent-hover: #7c3aed;
  --danger: #ef4444;
  --success: #22c55e;

  --bg-light: #f9fafb;
  --bg-card-light: #ffffff;
  --bg-input-light: #f3f4f6;
  --border-light: #e5e7eb;
  --text-primary-light: #111827;
  --text-secondary-light: #6b7280;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

body.light-mode {
  background: var(--bg-light);
  color: var(--text-primary-light);
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 0; }

/* ===== AUTH SCREEN ===== */
.auth-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.auth-box {
  width: 100%;
  max-width: 380px;
  text-align: center;
}

.auth-logo {
  font-size: 48px;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 8px;
  letter-spacing: -2px;
}

.auth-subtitle {
  color: var(--text-secondary);
  margin-bottom: 32px;
  font-size: 14px;
}

body.light-mode .auth-subtitle { color: var(--text-secondary-light); }

.auth-form { display: flex; flex-direction: column; gap: 12px; }

.auth-input {
  background: var(--bg-input);
  border: 1px solid var(--border-dark);
  border-radius: 12px;
  padding: 14px 16px;
  color: var(--text-primary);
  font-size: 15px;
  outline: none;
  transition: border-color .2s;
}

.auth-input:focus { border-color: var(--accent); }

body.light-mode .auth-input {
  background: var(--bg-input-light);
  border-color: var(--border-light);
  color: var(--text-primary-light);
}

.auth-btn {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s;
  margin-top: 4px;
}

.auth-btn:hover { background: var(--accent-hover); }

.auth-toggle {
  margin-top: 20px;
  color: var(--text-secondary);
  font-size: 13px;
}

body.light-mode .auth-toggle { color: var(--text-secondary-light); }

.auth-toggle span {
  color: var(--accent);
  cursor: pointer;
  font-weight: 600;
}

.auth-error {
  color: var(--danger);
  font-size: 13px;
  min-height: 20px;
}

/* ===== APP LAYOUT ===== */
.app-container { display: none; flex-direction: column; height: 100vh; }

/* ===== TOP BAR ===== */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--bg-dark);
  border-bottom: 1px solid var(--border-dark);
  position: sticky;
  top: 0;
  z-index: 100;
}

body.light-mode .top-bar {
  background: var(--bg-light);
  border-color: var(--border-light);
}

.top-bar-logo {
  font-size: 24px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -1px;
}

.top-bar-actions { display: flex; gap: 16px; align-items: center; }

.top-bar-actions i {
  font-size: 20px;
  color: var(--text-secondary);
  cursor: pointer;
  position: relative;
  transition: color .2s;
}

.top-bar-actions i:hover { color: var(--text-primary); }

body.light-mode .top-bar-actions i { color: var(--text-secondary-light); }
body.light-mode .top-bar-actions i:hover { color: var(--text-primary-light); }

.notif-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  background: var(--danger);
  color: white;
  font-size: 10px;
  font-weight: 700;
  min-width: 16px;
  height: 16px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-style: normal;
}

/* ===== CONTENT AREA ===== */
.content-area {
  flex: 1;
  overflow-y: auto;
  padding-bottom: 70px;
}

.screen { display: none; }
.screen.active { display: block; }

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 10px 0;
  background: var(--bg-dark);
  border-top: 1px solid var(--border-dark);
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
}

body.light-mode .bottom-nav {
  background: var(--bg-light);
  border-color: var(--border-light);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 10px;
  transition: color .2s;
}

.nav-item i { font-size: 22px; }
.nav-item.active { color: var(--accent); }

body.light-mode .nav-item { color: var(--text-secondary-light); }
body.light-mode .nav-item.active { color: var(--accent); }

.nav-avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid transparent;
}

.nav-item.active .nav-avatar { border-color: var(--accent); }

/* ===== FEED / POSTS ===== */
.feed-container { max-width: 600px; margin: 0 auto; }

.create-post-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  border-bottom: 1px solid var(--border-dark);
  cursor: pointer;
}

body.light-mode .create-post-bar { border-color: var(--border-light); }

.create-post-bar img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
}

.create-post-placeholder {
  flex: 1;
  color: var(--text-secondary);
  font-size: 14px;
}

body.light-mode .create-post-placeholder { color: var(--text-secondary-light); }

/* Post Card */
.post-card {
  padding: 16px;
  border-bottom: 1px solid var(--border-dark);
}

body.light-mode .post-card { border-color: var(--border-light); }

.post-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.post-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: cover;
  cursor: pointer;
}

.post-user-info { flex: 1; }

.post-username {
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}

.post-username:hover { text-decoration: underline; }

.post-time {
  font-size: 11px;
  color: var(--text-secondary);
}

body.light-mode .post-time { color: var(--text-secondary-light); }

.post-menu {
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 18px;
}

.post-content {
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 12px;
  white-space: pre-wrap;
  word-break: break-word;
}

.post-media {
  width: 100%;
  border-radius: 12px;
  margin-bottom: 12px;
  max-height: 500px;
  object-fit: cover;
}

.post-media-video {
  width: 100%;
  border-radius: 12px;
  margin-bottom: 12px;
  max-height: 500px;
}

.post-actions {
  display: flex;
  gap: 20px;
  align-items: center;
}

.post-action {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  transition: color .2s;
}

body.light-mode .post-action { color: var(--text-secondary-light); }

.post-action:hover { color: var(--accent); }
.post-action.liked { color: var(--danger); }
.post-action.liked i { font-weight: 900; }

/* ===== CREATE POST MODAL ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}

.modal-overlay.show { display: flex; }

.modal-content {
  background: var(--bg-card);
  width: 100%;
  max-width: 600px;
  border-radius: 20px 20px 0 0;
  padding: 20px;
  max-height: 90vh;
  overflow-y: auto;
}

body.light-mode .modal-content {
  background: var(--bg-card-light);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.modal-header h3 { font-size: 16px; font-weight: 700; }

.modal-close {
  color: var(--text-secondary);
  font-size: 22px;
  cursor: pointer;
}

.modal-textarea {
  width: 100%;
  min-height: 120px;
  background: transparent;
  border: none;
  color: var(--text-primary);
  font-size: 16px;
  resize: none;
  outline: none;
  font-family: inherit;
}

body.light-mode .modal-textarea { color: var(--text-primary-light); }

.modal-textarea::placeholder { color: var(--text-secondary); }

body.light-mode .modal-textarea::placeholder { color: var(--text-secondary-light); }

.modal-media-preview {
  width: 100%;
  max-height: 200px;
  border-radius: 12px;
  object-fit: cover;
  margin-bottom: 12px;
}

.modal-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
}

.modal-media-btn {
  color: var(--accent);
  font-size: 22px;
  cursor: pointer;
}

.modal-post-btn {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 20px;
  padding: 8px 24px;
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
}

/* ===== SEARCH ===== */
.search-container { padding: 16px; max-width: 600px; margin: 0 auto; }

.search-input-wrapper {
  display: flex;
  align-items: center;
  background: var(--bg-input);
  border: 1px solid var(--border-dark);
  border-radius: 12px;
  padding: 10px 14px;
  gap: 10px;
  margin-bottom: 16px;
}

body.light-mode .search-input-wrapper {
  background: var(--bg-input-light);
  border-color: var(--border-light);
}

.search-input-wrapper i {
  color: var(--text-secondary);
  font-size: 16px;
}

.search-input-wrapper input {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-primary);
  font-size: 15px;
  outline: none;
}

body.light-mode .search-input-wrapper input { color: var(--text-primary-light); }

.search-results { display: flex; flex-direction: column; gap: 8px; }

.search-user-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  border-radius: 12px;
  cursor: pointer;
  transition: background .2s;
}

.search-user-item:hover { background: var(--bg-input); }

body.light-mode .search-user-item:hover { background: var(--bg-input-light); }

.search-user-item img {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  object-fit: cover;
}

.search-user-name { font-weight: 600; font-size: 14px; }

.search-user-username {
  font-size: 12px;
  color: var(--text-secondary);
}

body.light-mode .search-user-username { color: var(--text-secondary-light); }

/* ===== NOTIFICATIONS ===== */
.notif-container { max-width: 600px; margin: 0 auto; padding: 16px; }

.notif-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 16px;
}

.notif-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-radius: 12px;
  transition: background .2s;
  cursor: pointer;
}

.notif-item:hover { background: var(--bg-input); }

body.light-mode .notif-item:hover { background: var(--bg-input-light); }

.notif-item img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
}

.notif-text { font-size: 13px; line-height: 1.4; flex:1; }

.notif-text b { font-weight: 600; }

.notif-time {
  font-size: 11px;
  color: var(--text-secondary);
  white-space: nowrap;
}

body.light-mode .notif-time { color: var(--text-secondary-light); }

/* ===== PROFILE ===== */
.profile-container { max-width: 600px; margin: 0 auto; }

.profile-banner {
  width: 100%;
  height: 150px;
  object-fit: cover;
  cursor: pointer;
}

.profile-header {
  padding: 0 16px;
  margin-top: -40px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}

.profile-pic {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid var(--bg-dark);
  cursor: pointer;
}

body.light-mode .profile-pic { border-color: var(--bg-light); }

.profile-edit-btn {
  background: transparent;
  border: 1px solid var(--border-dark);
  color: var(--text-primary);
  border-radius: 20px;
  padding: 6px 16px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 10px;
}

body.light-mode .profile-edit-btn {
  border-color: var(--border-light);
  color: var(--text-primary-light);
}

.profile-info { padding: 12px 16px; }

.profile-name { font-size: 18px; font-weight: 700; }

.profile-username {
  font-size: 14px;
  color: var(--text-secondary);
}

body.light-mode .profile-username { color: var(--text-secondary-light); }

.profile-bio {
  font-size: 14px;
  margin-top: 8px;
  line-height: 1.4;
}

.profile-stats {
  display: flex;
  gap: 20px;
  margin-top: 12px;
  font-size: 14px;
}

.profile-stats span { color: var(--text-secondary); }
.profile-stats b { color: var(--text-primary); }

body.light-mode .profile-stats span { color: var(--text-secondary-light); }
body.light-mode .profile-stats b { color: var(--text-primary-light); }

.profile-tabs {
  display: flex;
  border-bottom: 1px solid var(--border-dark);
  margin-top: 16px;
}

body.light-mode .profile-tabs { border-color: var(--border-light); }

.profile-tab {
  flex: 1;
  text-align: center;
  padding: 12px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .2s;
}

body.light-mode .profile-tab { color: var(--text-secondary-light); }

.profile-tab.active {
  color: var(--text-primary);
  border-color: var(--accent);
}

body.light-mode .profile-tab.active { color: var(--text-primary-light); }

.profile-posts-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
  padding: 2px;
}

.grid-item {
  aspect-ratio: 1;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  background: var(--bg-input);
}

body.light-mode .grid-item { background: var(--bg-input-light); }

.grid-item img, .grid-item video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.grid-item i {
  position: absolute;
  top: 8px;
  right: 8px;
  color: white;
  font-size: 14px;
  text-shadow: 0 1px 3px rgba(0,0,0,.5);
}

/* ===== VIEW PROFILE (other users) ===== */
.view-profile-container { max-width: 600px; margin: 0 auto; }

.view-profile-back {
  padding: 12px 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
}

.view-profile-back i { font-size: 18px; }

.follow-btn {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 20px;
  padding: 6px 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 10px;
}

.follow-btn.following {
  background: transparent;
  border: 1px solid var(--border-dark);
  color: var(--text-primary);
}

body.light-mode .follow-btn.following {
  border-color: var(--border-light);
  color: var(--text-primary-light);
}

/* ===== CHAT LIST ===== */
.chat-list-container { max-width: 600px; margin: 0 auto; padding: 16px; }

.chat-list-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 16px;
}

.chat-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-radius: 12px;
  cursor: pointer;
  transition: background .2s;
}

.chat-item:hover { background: var(--bg-input); }

body.light-mode .chat-item:hover { background: var(--bg-input-light); }

.chat-item img {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
}

.chat-item-info { flex: 1; }

.chat-item-name { font-weight: 600; font-size: 14px; }

.chat-item-last {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
}

body.light-mode .chat-item-last { color: var(--text-secondary-light); }

.chat-item-time {
  font-size: 11px;
  color: var(--text-secondary);
}

body.light-mode .chat-item-time { color: var(--text-secondary-light); }

.chat-unseen-badge {
  background: var(--accent);
  color: white;
  font-size: 10px;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== PRIVATE CHAT ===== */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.chat-msg {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.4;
  word-break: break-word;
}

.chat-msg.sent {
  align-self: flex-end;
  background: var(--accent);
  color: white;
  border-bottom-right-radius: 4px;
}

.chat-msg.received {
  align-self: flex-start;
  background: var(--bg-input);
  color: var(--text-primary);
  border-bottom-left-radius: 4px;
}

body.light-mode .chat-msg.received {
  background: var(--bg-input-light);
  color: var(--text-primary-light);
}

.chat-msg-time {
  font-size: 10px;
  color: rgba(255,255,255,.5);
  margin-top: 4px;
  text-align: right;
}

.chat-msg.received .chat-msg-time { color: var(--text-secondary); }

body.light-mode .chat-msg.received .chat-msg-time { color: var(--text-secondary-light); }

.chat-input {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border-dark);
  border-radius: 25px;
  padding: 14px 18px;
  color: var(--text-primary);
  outline: none;
  font-size: 14px;
  font-family: inherit;
}

.chat-input::placeholder { color: var(--text-secondary); }

body.light-mode .chat-input {
  background: var(--bg-input-light);
  border-color: var(--border-light);
  color: var(--text-primary-light);
}

body.light-mode .chat-input::placeholder { color: var(--text-secondary-light); }

/* ===== SETTINGS ===== */
.settings-container { max-width: 600px; margin: 0 auto; padding: 16px; }

.settings-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 20px;
}

.settings-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid var(--border-dark);
  cursor: pointer;
}

body.light-mode .settings-item { border-color: var(--border-light); }

.settings-item-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.settings-item-left i {
  font-size: 18px;
  color: var(--text-secondary);
  width: 24px;
  text-align: center;
}

body.light-mode .settings-item-left i { color: var(--text-secondary-light); }

.settings-item-label { font-size: 15px; }

.settings-item-right {
  color: var(--text-secondary);
  font-size: 14px;
}

body.light-mode .settings-item-right { color: var(--text-secondary-light); }

.toggle-switch {
  width: 44px;
  height: 24px;
